name: Build verylogic-nextpnr

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: verylogic-nextpnr tag or full 40-character commit SHA
        required: true
      version:
        description: Conda package version
        required: true
        default: 0.1.4
      publish:
        description: Publish the tested package into the channel
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-verylogic-nextpnr
  cancel-in-progress: false

jobs:
  validate:
    name: Validate workflow
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out channel
        uses: actions/checkout@v5

      - name: Set up validation environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: pixi.toml
          environments: default
          frozen: true
          cache: true

      - name: Validate publishing workflow
        run: pixi run python .github/scripts/validate_verylogic_nextpnr_workflow.py

  build:
    name: Build Python ${{ matrix.python }}
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            tag: py312
          - python: "3.13"
            tag: py313
    env:
      VERYLOGIC_CONDA_OUTPUT: ${{ github.workspace }}/b

    steps:
      - name: Check out verylogic-nextpnr
        uses: actions/checkout@v5
        with:
          repository: VIDLG/verylogic-nextpnr
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: recursive

      - name: Validate immutable source
        shell: pwsh
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $headCommit = (git rev-parse HEAD).Trim()
          if ($env:SOURCE_REF -match '^v(.+)$') {
            if ($Matches[1] -ne $env:PACKAGE_VERSION) {
              throw "Tag $env:SOURCE_REF does not match package version $env:PACKAGE_VERSION"
            }
            $tagCommit = (git rev-list -n 1 "refs/tags/$env:SOURCE_REF").Trim()
            if ($tagCommit -ne $headCommit) {
              throw "Checked-out commit does not match tag $env:SOURCE_REF"
            }
          } elseif ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_ref must be a version tag or a full 40-character commit SHA"
          } elseif ($env:SOURCE_REF -ne $headCommit) {
            throw "Checked-out commit does not match source_ref"
          }

      - name: Set up cached packaging environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: source/pixi.toml
          environments: conda-package
          frozen: true
          cache: true

      # The recipe build owns its output root. Clean it before restoring source
      # downloads so the cache remains reusable without preserving build trees.
      - name: Prepare conda output
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:VERYLOGIC_CONDA_OUTPUT) {
            Remove-Item -LiteralPath $env:VERYLOGIC_CONDA_OUTPUT -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:VERYLOGIC_CONDA_OUTPUT | Out-Null

      - name: Cache pinned recipe sources
        uses: actions/cache@v6
        with:
          path: ${{ env.VERYLOGIC_CONDA_OUTPUT }}/src_cache
          key: recipe-sources-${{ runner.os }}-${{ hashFiles('source/verylogic/packaging/conda/**') }}
          restore-keys: |
            recipe-sources-${{ runner.os }}-

      - name: Cache C++ compilation
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-v3-${{ runner.os }}-${{ matrix.tag }}-${{ hashFiles('source/CMakeLists.txt', 'source/common/**', 'source/ice40/**', 'source/himbaechel/**', 'source/gui/**') }}
          restore-keys: |
            sccache-v3-${{ runner.os }}-${{ matrix.tag }}-
            sccache-v2-${{ runner.os }}-

      - name: Build conda package
        working-directory: source
        env:
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          VERYLOGIC_NEXTPNR_VERSION: ${{ inputs.version }}
        run: pixi run --environment conda-package rattler-build build --recipe verylogic/packaging/conda/recipe.yaml --ignore-recipe-variants --variant "python=${{ matrix.python }}" --target-platform win-64 --output-dir "$env:VERYLOGIC_CONDA_OUTPUT" --channel conda-forge --package-format conda --test skip --no-build-id

      - name: Verify package artifact
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PYTHON_TAG: ${{ matrix.tag }}
        run: |
          $escapedVersion = [regex]::Escape($env:PACKAGE_VERSION)
          $pattern = Join-Path $env:VERYLOGIC_CONDA_OUTPUT "win-64/verylogic-nextpnr-*.conda"
          $packages = @(Get-ChildItem -Path $pattern | Where-Object {
            $_.Name -match "^verylogic-nextpnr-${escapedVersion}-$($env:PYTHON_TAG)h[0-9a-f]+_\d+\.conda$"
          })
          if ($packages.Count -ne 1) {
            throw "Expected one $env:PYTHON_TAG package, found $($packages.Count)"
          }

      - name: Upload package variant
        uses: actions/upload-artifact@v7
        with:
          name: verylogic-nextpnr-${{ inputs.version }}-${{ matrix.tag }}-win-64
          path: ${{ env.VERYLOGIC_CONDA_OUTPUT }}/win-64/verylogic-nextpnr-*.conda
          if-no-files-found: error
          retention-days: 14

  test-and-publish:
    name: Test and publish
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CHANNEL_ROOT: ${{ github.workspace }}/channel
      VERYLOGIC_CONDA_OUTPUT: ${{ github.workspace }}/b

    steps:
      - name: Check out channel
        uses: actions/checkout@v5
        with:
          path: channel

      - name: Check out verylogic-nextpnr
        uses: actions/checkout@v5
        with:
          repository: VIDLG/verylogic-nextpnr
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: recursive

      - name: Validate immutable source
        shell: pwsh
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $headCommit = (git rev-parse HEAD).Trim()
          if ($env:SOURCE_REF -match '^v(.+)$') {
            if ($Matches[1] -ne $env:PACKAGE_VERSION) {
              throw "Tag $env:SOURCE_REF does not match package version $env:PACKAGE_VERSION"
            }
            $tagCommit = (git rev-list -n 1 "refs/tags/$env:SOURCE_REF").Trim()
            if ($tagCommit -ne $headCommit) {
              throw "Checked-out commit does not match tag $env:SOURCE_REF"
            }
          } elseif ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_ref must be a version tag or a full 40-character commit SHA"
          } elseif ($env:SOURCE_REF -ne $headCommit) {
            throw "Checked-out commit does not match source_ref"
          }
          "SOURCE_COMMIT=$headCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up cached packaging environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: source/pixi.toml
          environments: conda-package
          frozen: true
          cache: true

      - name: Prepare combined package output
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:VERYLOGIC_CONDA_OUTPUT) {
            Remove-Item -LiteralPath $env:VERYLOGIC_CONDA_OUTPUT -Recurse -Force
          }
          New-Item -ItemType Directory -Path "$env:VERYLOGIC_CONDA_OUTPUT/win-64" | Out-Null

      - name: Download package variants
        uses: actions/download-artifact@v8
        with:
          pattern: verylogic-nextpnr-${{ inputs.version }}-*-win-64
          path: ${{ env.VERYLOGIC_CONDA_OUTPUT }}/win-64
          merge-multiple: true

      - name: Test installed conda package variants
        working-directory: source
        run: pixi run --environment conda-package just conda-test

      - name: Test installed package-pin Python API
        working-directory: source
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: pixi run --environment conda-package python ../channel/.github/scripts/test_verylogic_nextpnr_package_pins.py "$env:VERYLOGIC_CONDA_OUTPUT" "$env:PACKAGE_VERSION" ../channel/.github/scripts/verylogic_nextpnr_package_pin_smoke.py

      - name: Verify combined package artifacts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $packagePattern = Join-Path $env:VERYLOGIC_CONDA_OUTPUT "win-64/verylogic-nextpnr-*.conda"
          $packages = @(Get-ChildItem -Path $packagePattern)
          if ($packages.Count -ne 2) {
            throw "Expected two verylogic-nextpnr Python variants, found $($packages.Count)"
          }
          $escapedVersion = [regex]::Escape($env:PACKAGE_VERSION)
          foreach ($pythonTag in @("py312", "py313")) {
            $matches = @($packages | Where-Object {
              $_.Name -match "^verylogic-nextpnr-${escapedVersion}-${pythonTag}h[0-9a-f]+_\d+\.conda$"
            })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one verylogic-nextpnr $env:PACKAGE_VERSION $pythonTag package, found $($matches.Count)"
            }
          }

      - name: Upload tested package set
        uses: actions/upload-artifact@v7
        with:
          name: verylogic-nextpnr-${{ inputs.version }}-win-64
          path: ${{ env.VERYLOGIC_CONDA_OUTPUT }}/win-64/verylogic-nextpnr-*.conda
          if-no-files-found: error
          retention-days: 14

      - name: Publish package into static channel
        if: inputs.publish
        shell: pwsh
        working-directory: source
        run: |
          $packagePattern = Join-Path $env:VERYLOGIC_CONDA_OUTPUT "win-64/verylogic-nextpnr-*.conda"
          $packages = @(Get-ChildItem -Path $packagePattern)

          $channelPath = (Resolve-Path $env:CHANNEL_ROOT).Path
          $packagePaths = @()
          foreach ($package in $packages) {
            $existingPackage = Join-Path $channelPath "win-64/$($package.Name)"
            if (Test-Path $existingPackage) {
              $newHash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash
              $existingHash = (Get-FileHash $existingPackage -Algorithm SHA256).Hash
              if ($newHash -eq $existingHash) {
                Write-Host "Channel already contains identical package $($package.Name)."
                continue
              }
              throw "Refusing to replace existing package $($package.Name) with different content"
            }
            $packagePaths += $package.FullName
          }
          if ($packagePaths.Count -eq 0) {
            Write-Host "Channel already contains both identical packages."
            exit 0
          }

          $channelUri = ([System.Uri]$channelPath).AbsoluteUri
          pixi run --environment conda-package rattler-build publish @packagePaths --to $channelUri

      - name: Commit channel index and package
        if: inputs.publish
        shell: pwsh
        working-directory: channel
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add win-64 noarch
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Channel already contains this package."
            exit 0
          }
          $shortCommit = $env:SOURCE_COMMIT.Substring(0, 12)
          git commit -m "Publish verylogic-nextpnr $env:PACKAGE_VERSION ($shortCommit)"
          git push
